sonar.projectKey=ecaceresu-lab_proyecto_f2
sonar.projectName=proyecto_f2
sonar.projectVersion=1.0.0

# Configuracion SonarCloud
sonar.organization=ecaceresu-lab
sonar.host.url=https://sonarcloud.io

# Archivos fuente y pruebas
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js

# Exclusiones
sonar.exclusions=**/node_modules/**,coverage/**,tests/load/**,tests/api/**

# Cobertura de codigo reportada por Jest
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
