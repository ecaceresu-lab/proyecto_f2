sonar.projectKey=orders-ecommerce-api
sonar.projectName=Orders and Products E-Commerce API
sonar.projectVersion=1.0.0

# Archivos fuente y pruebas
sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.js

# Exclusiones
sonar.exclusions=**/node_modules/**,coverage/**,tests/load/**,tests/api/**

# Cobertura de codigo reportada por Jest
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8
